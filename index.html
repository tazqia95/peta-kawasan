<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Interaktif Sari Ater - Holden GPS Tracker</title>
    <!-- Masukkan CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #0b1a0b;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        /* Styling untuk Ikon Mobil Holden dengan efek Glow Biru */
        .holden-icon {
            background: rgba(0, 150, 255, 0.2);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(0, 150, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Panel Informasi Status GPS di Pojok Layar */
        #gps-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 1000;
            max-width: 250px;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="gps-info">Menunggu sinyal GPS HP Anda...</div>

    <!-- Masukkan JavaScript Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inisialisasi Peta dengan CRS.Simple (Kanvas Masterplan 2D)
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 4,
            zoomControl: false
        });

        // 2. Ukuran piksel gambar masterplan Anda
        var w = 2000; 
        var h = 1143;
        var southWest = map.unproject([0, h], map.getMaxZoom());
        var northEast = map.unproject([w, 0], map.getMaxZoom());
        var imageBounds = new L.LatLngBounds(southWest, northEast);

        // 3. Masukkan Gambar Masterplan Sebagai Peta Utama
        var masterplanOverlay = L.imageOverlay('masterplan.png', imageBounds).addTo(map);
        
        // Memusatkan tampilan layar ke tengah masterplan
        var centerPoint = map.unproject([w / 2, h / 2], map.getMaxZoom());
        map.setView(centerPoint, 0);

        // 4. Membuat Ikon Kustom untuk Mobil Klasik Holden Kingswood
        var holdenIcon = L.divIcon({
            className: 'holden-icon',
            html: '<img src="holden_icon.png" style="width: 45px; height: 45px; transform: rotate(0deg); transition: transform 0.1s ease;" id="car-img" />',
            iconSize: [50, 50],
            iconAnchor: [25, 25]
        });

        var carMarker = L.marker(centerPoint, {icon: holdenIcon}).addTo(map);
        carMarker.bindPopup("<b>Holden Kingswood Sari Ater</b><br>Kendaraan Wisata Interaktif").openPopup();

        // 5. Integrasi GPS Nyata dengan Kalibrasi Area Ciater/Sari Ater (-6.745, 107.695)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                
                document.getElementById('gps-info').innerHTML = 
                    "<b>GPS Aktif:</b><br>Lat: " + lat.toFixed(5) + "<br>Lng: " + lng.toFixed(5);

                // TITIK KALIBRASI AREA SARI ATER:
                // Pusat koordinat GPS dunia nyata kawasan Sari Ater (Letak tengah masterplan)
                var centerLat = -6.74500; 
                var centerLng = 107.69500;

                // Faktor pengali skala piksel (bisa disesuaikan jika pergerakan mobil terlalu cepat/lambat di peta)
                var scaleFactor = 150000; 

                // Menghitung selisih koordinat dan menerjemahkannya ke piksel kanvas
                var xMapped = (w / 2) + ((lng - centerLng) * scaleFactor);
                var yMapped = (h / 2) - ((lat - centerLat) * scaleFactor); // Minus karena sumbu Y kanvas ke bawah
                
                var gpsPoint = map.unproject([xMapped, yMapped], map.getMaxZoom());
                carMarker.setLatLng(gpsPoint);
                
                // Opsional: Peta otomatis mengikuti posisi mobil
                // map.panTo(gpsPoint);
                
            }, function(error) {
                document.getElementById('gps-info').innerHTML = "<b>Gagal Mendeteksi GPS:</b> " + error.message;
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        } else {
            document.getElementById('gps-info').innerHTML = "Browser Anda tidak mendukung GPS.";
        }

        // 6. Mengaktifkan Kompas Giroskop HP untuk Memutar Aset Mobil Holden
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(event) {
                var compassHeading = event.alpha; // Arah kompas (0 - 360 derajat)
                if (compassHeading !== null) {
                    var carImg = document.getElementById('car-img');
                    if (carImg) {
                        carImg.style.transform = 'rotate(' + compassHeading + 'deg)';
                    }
                }
            }, true);
        }
    </script>
</body>
</html>
