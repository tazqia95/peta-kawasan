<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Tracking Pengunjung</title>
    <style>
        /* Mengatur agar peta tampil penuh di layar HP */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        let map;
        let userMarker;

        function initMap() {
    // Membaca parameter dari URL (lat, lng, dan nama pos)
    const urlParams = new URLSearchParams(window.location.search);
    
    // Nilai default jika URL dibuka tanpa parameter
    const defaultLat = parseFloat(urlParams.get('lat')) || -6.7373; 
    const defaultLng = parseFloat(urlParams.get('lng')) || 107.6536;
    const namaPos = urlParams.get('pos') || "Pos Informasi";

    const titikAwal = { lat: defaultLat, lng: defaultLng };

    // Inisialisasi Google Maps
    map = new google.maps.Map(document.getElementById("map"), {
        center: titikAwal,
        zoom: 18,
        disableDefaultUI: true,
    });

    // Menampilkan penanda awal sesuai Pos tempat scan
    userMarker = new google.maps.Marker({
        position: titikAwal,
        map: map,
        title: `Lokasi Awal: ${namaPos}`,
        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
    });

    // Info Window sederhana untuk memberi tahu pengunjung posisi awal mereka
    const infoWindow = new google.maps.InfoWindow({
        content: `<b>Anda berada di ${namaPos}</b><br>Mengaktifkan GPS...`
    });
    infoWindow.open(map, userMarker);

    // Memulai pelacakan GPS
    mulaiTracking();
}

        function mulaiTracking() {
            if (navigator.geolocation) {
                // watchPosition akan terus mengambil lokasi terbaru selama web terbuka
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lokasiBaru = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                        };

                        // Menggeser marker ke posisi GPS terbaru
                        userMarker.setPosition(lokasiBaru);
                        
                        // Opsional: Membuat peta otomatis bergeser (pan) mengikuti marker
                        map.panTo(lokasiBaru);
                    },
                    (error) => {
                        console.warn("Gagal mendapatkan lokasi: ", error.message);
                    },
                    {
                        enableHighAccuracy: true, // Penting agar GPS akurat saat pengunjung berjalan kaki
                        maximumAge: 0,
                        timeout: 5000
                    }
                );
            } else {
                alert("Browser pada perangkat ini tidak mendukung pelacakan GPS.");
            }
        }
    </script>

    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB56tNmyAQvTeljCCwPKCa_J13JC0nEs7U&callback=initMap"></script>

</body>
</html>
