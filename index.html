<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peta Masterplan Sari Ater - Holden GPS Tracker</title>
    <!-- Masukkan CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #111; /* Latar belakang luar peta bernuansa gelap */
        }
        #map {
            height: 100vh;
            width: 100vw;
            background: #e5e3df; /* Warna dasar area kosong peta */
        }
        /* Styling untuk Ikon Mobil Holden dengan efek Glow Biru */
        .holden-icon {
            background: rgba(0, 150, 255, 0.3);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Panel Info GPS di Layar */
        #gps-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 11px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="gps-status">Mencari sinyal GPS...</div>

    <!-- Masukkan JavaScript Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Titik Pusat Awal di Sari Ater
        var currentLat = -6.737448411559581;
        var currentLng = 107.65822384739292;

        // Inisialisasi Peta dengan batasan minZoom agar tidak bisa terlalu jauh di-zoom out
        var map = L.map('map', {
            zoomControl: false,
            minZoom: 16, // Batas minimal zoom out (bisa dinaikkan ke 17 jika ingin lebih mengunci)
            maxZoom: 21
        }).setView([currentLat, currentLng], 18);

        // 2. Menampilkan Masterplan secara Permanen & Mengunci Batas Geser (MaxBounds)
        var img = new Image();
        img.src = 'masterplan.png';
        
        img.onload = function() {
            var imgWidth = this.width;   
            var imgHeight = this.height; 
            
            var baseLatSpan = 0.0035; 
            var baseLngSpan = 0.0035;

            if (imgWidth >= imgHeight) {
                baseLngSpan = 0.0040;
                baseLatSpan = 0.0040 * (imgHeight / imgWidth);
            } else {
                baseLatSpan = 0.0040;
                baseLngSpan = 0.0040 * (imgWidth / imgHeight);
            }

            var finalScale = 4.7; // Skala hasil kalibrasi Anda
            var latSpan = baseLatSpan * finalScale;
            var lngSpan = baseLngSpan * finalScale;

            var latOffset = 0.00240; // Offset hasil kalibrasi Anda
            var lngOffset = 0.00240;

            var activeCenterLat = currentLat + latOffset; 
            var activeCenterLng = currentLng + lngOffset;

            var masterplanBounds = [
                [activeCenterLat - (latSpan / 2), activeCenterLng - (lngSpan / 2)], 
                [activeCenterLat + (latSpan / 2), activeCenterLng + (lngSpan / 2)]  
            ];

            // Memasukkan gambar masterplan sebagai tampilan peta utama
            L.imageOverlay('masterplan.png', masterplanBounds, {
                opacity: 1.0, 
                interactive: false
            }).addTo(map);

            // Kunci Area Peta agar tidak bisa digeser atau di-zoom out keluar dari masterplan
            map.setMaxBounds(masterplanBounds);
            map.options.maxBoundsViscosity = 1.0; 
        };

        // 3. Membuat Ikon Kustom untuk Mobil Klasik Holden Kingswood
        var holdenIcon = L.divIcon({
            className: 'holden-icon',
            html: '<img src="holden_icon.png" style="width: 45px; height: 45px; transform: rotate(0deg); transition: transform 0.1s ease;" id="car-img" />',
            iconSize: [50, 50],
            iconAnchor: [25, 25]
        });

        // Menempatkan marker mobil di koordinat Anda
        var carMarker = L.marker([currentLat, currentLng], {icon: holdenIcon}).addTo(map);
        carMarker.bindPopup("<b>Holden Kingswood</b><br>Kendaraan Wisata Sari Ater").openPopup();

        // 4. Melacak GPS Nyata Pengguna secara Real-Time (atau Sensor Manual PC)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                
                document.getElementById('gps-status').innerHTML = 
                    "<b>GPS Terhubung:</b><br>Lat: " + lat.toFixed(5) + "<br>Lng: " + lng.toFixed(5);

                // Memperbarui posisi marker mobil sesuai pergerakan GPS
                carMarker.setLatLng([lat, lng]);

            }, function(error) {
                document.getElementById('gps-status').innerHTML = "<b>GPS Error:</b> " + error.message;
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        } else {
            document.getElementById('gps-status').innerHTML = "GPS tidak didukung browser ini.";
        }

        // 5. Mengaktifkan Kompas Giroskop HP untuk Memutar Aset Mobil
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(event) {
                var compassHeading = event.alpha; // Arah kompas (0 - 360 derajat)
                if (compassHeading !== null) {
                    var carImg = document.getElementById('car-img');
                    if (carImg) {
                        carImg.style.transform = 'rotate(' + compassHeading + 'deg)';
                    }
                }
            }, true);
        }
    </script>
</body>
</html>
